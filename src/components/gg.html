<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated YouTube Iframes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }

    iframe {
      opacity: 0;
      transform: translateY(50px);
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/D5w9zZv2r5U"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
  ></iframe>

  <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/gfsiQx-wWM4"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
  ></iframe>

  <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/bobI5nFCTMM"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
  ></iframe>

  <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/0cAxQYILI0E"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
  ></iframe>

  <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/irvINBngFT0"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
  ></iframe>

  <script>
    // Apply animation to all iframe elements
    gsap.fromTo(
      "iframe",
      {
        opacity: 0,
        y: 50,
      },
      {
        opacity: 1,
        y: 0,
        duration: 1,
        stagger: 0.3, // Animates each iframe with a delay
        ease: "power2.out",
      }
    );
  </script>
</body>
</html>
